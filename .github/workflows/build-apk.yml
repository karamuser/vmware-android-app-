name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # إنشاء مجلد android حديث ونظيف مع دعم V2 Embedding تلقائياً
      - name: Create Clean Android Platform
        run: flutter create . --platforms=android --org com.example

      # إجبار التوافق مع compileSdk 36 و Java 17 لمنع أخطاء المكتبات
      - name: Configure SDK & Java Compatibility
        run: |
          sed -i 's/compileSdkVersion.*/compileSdkVersion 36/g' android/app/build.gradle || true
          echo "subprojects { afterEvaluate { project -> if (project.hasProperty('android')) { project.android { compileSdkVersion 36 } } } }" >> android/build.gradle

      - name: Fetch Flutter Packages
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: free-DROID-release
          path: build/app/outputs/flutter-apk/app-release.apk
          
